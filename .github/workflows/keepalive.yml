name: Supabase wach halten

# Gratis-Projekte pausiert Supabase nach einer Woche mit zu wenig Datenbank-Aktivität.
# Täglich ein Aufruf der Funktion ping (nur mit dem öffentlichen Schlüssel). Sie schreibt
# einen Zeitstempel in die Datenbank – ein reines Lesen hat im Nov. 2026 nicht gereicht.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# GitHub schaltet geplante Workflows in öffentlichen Repos nach 60 Tagen ohne Aktivität ab.
# Das umgehen wir bewusst nicht (Actions-Bedingungen). Kommt die Mail von GitHub, den Workflow
# unter Actions → „Supabase wach halten“ → „Enable workflow“ von Hand wieder einschalten.
# Pausiert Supabase doch einmal: Dashboard → Resume project (Daten bleiben erhalten).
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -m 30 -o /tmp/out.txt -w '%{http_code}' -X POST \
            -H "apikey: sb_publishable_k5lTVxYFROnQEBCDw0B4DQ_ZJNpmKcw" \
            -H "Content-Type: application/json" -d '{}' \
            https://uldwwhedugbygaukjkly.supabase.co/rest/v1/rpc/ping) || true
          cat /tmp/out.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet mit HTTP $code (000 = Adresse nicht erreichbar, Projekt evtl. pausiert)"
            exit 1
          fi
          # Antwort ist der gerade geschriebene Zeitstempel, z. B. "2026-11-19T05:23:04Z"
          beat=$(tr -d '"' < /tmp/out.txt)
          age=$(( $(date -u +%s) - $(date -u -d "$beat" +%s 2>/dev/null || echo 0) ))
          if [ "$age" -lt 0 ] || [ "$age" -gt 300 ]; then
            echo "::error::ping hat keinen frischen Zeitstempel geschrieben (Antwort: $beat). Schema in supabase/schema.sql aktuell?"
            exit 1
          fi
          echo "Herzschlag geschrieben: $beat"
