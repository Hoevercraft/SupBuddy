name: Supabase wach halten

# Gratis-Projekte pausiert Supabase nach einer Woche ohne Zugriff.
# Alle 3 Tage ein harmloser Aufruf (Funktion ping, nur mit dem öffentlichen Schlüssel).
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  # Nur für „sich selbst wieder aktivieren“ (siehe unten)
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST \
            -H "apikey: sb_publishable_k5lTVxYFROnQEBCDw0B4DQ_ZJNpmKcw" \
            -H "Content-Type: application/json" -d '{}' \
            https://uldwwhedugbygaukjkly.supabase.co/rest/v1/rpc/ping)
          cat /tmp/out.txt; echo
          test "$code" = "200"
      # GitHub schaltet geplante Workflows in öffentlichen Repos nach 60 Tagen ohne Commit ab.
      # Über die offizielle Schnittstelle wieder aktivieren (keine Schein-Commits). Ob das die
      # Frist zurücksetzt, ist nicht dokumentiert – schadet aber nicht. Fehler hier ignorieren.
      - name: Workflow aktiv halten
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
